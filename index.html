<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shared Bookmarks</title>
    <script type="module" src="script.js"></script>
  </head>
  <body>
    <main>
      <h1>Shared Bookmarks</h1>

      <section aria-labelledby="user-selection-heading">
        <h2 id="user-selection-heading">Select user</h2>
        <div id="user-selector"></div>
      </section>

      <section aria-labelledby="add-bookmark-heading">
        <h2 id="add-bookmark-heading">Add bookmark</h2>
        <form id="bookmark-form">
          <label for="url">URL</label>
          <input id="url" name="url" type="url" required />

          <label for="title">Title</label>
          <input id="title" name="title" type="text" required />

          <label for="description">Description</label>
          <textarea id="description" name="description" required></textarea>

          <button type="submit">Add bookmark</button>
        </form>
      </section>

      <section aria-labelledby="bookmarks-heading">
        <h2 id="bookmarks-heading">Bookmarks</h2>
        <div id="bookmarks" aria-live="polite"></div>
      </section>
    </main>
  </body>
</html>
